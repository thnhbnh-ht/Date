<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bông cóa điều muốn núaaaa</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #e3f2fd, #bbdefb);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.container {
    background: white;
    padding: 2rem;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 420px;
    max-height: 90vh;
    overflow: hidden;
    text-align: center;
    position: relative;
    animation: popIn 0.4s ease;
}

/* TITLE */
h1 {
    color: #1976d2;
    margin-bottom: 2rem;
}

/* BUTTON ZONE */
.buttons {
    position: relative;
    height: 80px;
}

button {
    padding: 12px 30px;
    font-size: 1.05rem;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
    transform: scale(1.08);
}

#yesBtn {
    background-color: #2196f3;
    color: white;
}

#noBtn {
    background-color: #bbdefb;
    color: #1976d2;
}

/* SUCCESS */
.success-msg {
    display: none;
    height: 100%;
    animation: fadeIn 0.4s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* FORM */
.form-wrapper {
    margin-top: 12px;
    height: 65vh;
    overflow-y: auto;
    border-radius: 12px;
}

.form-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* SHAKE */
.shake {
    animation: shake 0.3s;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
    75% { transform: translateX(-4px); }
    100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div class="container" id="mainCard">

    <h1 id="question">Thế đi nhởi với b honggg!!</h1>

    <div class="buttons" id="btnGroup">
        <button id="yesBtn" onclick="celebrate()">Ó kìiiiii</button>
        <button id="noBtn">Oh No!! Thế KHÔNG =))</button>
    </div>

    <div class="success-msg" id="successMsg">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSey7w3Ti4soSUQE9YJpLx-bgqhFQyp5ZouYp8ira5qsyXIsfw/viewform"
           target="_blank">
           👉 Mở form toàn màn hình
        </a>

        <div class="form-wrapper">
            <iframe
              src="https://docs.google.com/forms/d/e/1FAIpQLSey7w3Ti4soSUQE9YJpLx-bgqhFQyp5ZouYp8ira5qsyXIsfw/viewform?embedded=true">
            </iframe>
        </div>
    </div>

</div>

<script>
const noBtn = document.getElementById('noBtn');

function smartDodge(e) {
    const rect = noBtn.getBoundingClientRect();
    const distance = Math.hypot(
        e.clientX - (rect.left + rect.width / 2),
        e.clientY - (rect.top + rect.height / 2)
    );

    if (distance < 120) moveSmart(e.clientX, e.clientY);
}

document.addEventListener('mousemove', smartDodge);

function moveSmart(mouseX, mouseY) {
    const padding = 20;

    let x = mouseX + (mouseX < window.innerWidth / 2 ? 150 : -150);
    let y = mouseY + (mouseY < window.innerHeight / 2 ? 120 : -120);

    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    x = Math.max(padding, Math.min(x, maxX));
    y = Math.max(padding, Math.min(y, maxY));

    noBtn.style.position = 'fixed';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.zIndex = 9999;
}

function celebrate() {
    const card = document.getElementById('mainCard');

    /* TẮT HOÀN TOÀN NÉ */
    document.removeEventListener('mousemove', smartDodge);
    noBtn.style.display = 'none';

    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 300);

    document.getElementById('question').style.display = 'none';
    document.getElementById('btnGroup').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
}
</script>

</body>
</html>
